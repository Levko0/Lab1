name: Deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS: aws
      AWS_REGION: us-east-1
      PROJECT_NAME: successfulsuccess
      AWS_LAMBDA_ARCH: arm64
      AWS_DB_PASSWORD: ${{ secrets.AWS_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::219040782795:role/github-deploy
          aws-region: us-east-1
      - run: make aws-deploy-backend
      - run: make aws-deploy-frontend
