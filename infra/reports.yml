AWSTemplateFormatVersion: "2010-09-09"
Description: Weekly reports stack

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess

  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  RouteTableIds:
    Type: CommaDelimitedList

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  ImageUri:
    Type: String

  Architecture:
    Type: String
    Default: x86_64

  DatabaseUrl:
    Type: String
    NoEcho: true

  AppTimezone:
    Type: String
    Default: Europe/Kyiv

  SenderEmail:
    Type: String

  RecipientEmails:
    Type: String

  ScheduleExpression:
    Type: String
    Default: "cron(0 7 ? * MON *)"

Resources:
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds

  ReportDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: report-requests-dlq

  ReportQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: report-requests
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportDlq.Arn
        maxReceiveCount: 3

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendReportMessageToQueue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportQueue.Arn

  WeeklyReportSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report"
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: Europe/Kyiv
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

  ReportBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3PutReportPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
        - PolicyName: SqsConsumeReportQueuePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReportQueue.Arn

  ReportBuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-builder"
      RetentionInDays: 7

  ReportBuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - "app.reports.lambda_handler.handler"
      Architectures:
        - !Ref Architecture
      Role: !GetAtt ReportBuilderRole.Arn
      MemorySize: 512
      Timeout: 120
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          APP_TIMEZONE: !Ref AppTimezone
          REPORTS_BUCKET: !Sub "${ProjectName}-reports-${AWS::AccountId}"

  ReportQueueEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    DependsOn: ReportBuilderRole
    Properties:
      EventSourceArn: !GetAtt ReportQueue.Arn
      FunctionName: !GetAtt ReportBuilderFunction.Arn
      BatchSize: 1
      Enabled: true

  ReportMailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MailerPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Effect: Allow
                Action:
                  - ses:SendRawEmail
                  - ses:SendEmail
                Resource: "*"

  ReportMailerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-mailer"
      RetentionInDays: 7

  ReportMailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ReportMailerRole.Arn
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          RECIPIENT_EMAILS: !Ref RecipientEmails
      Code:
        ZipFile: |
          import json
          import logging
          import os
          import urllib.parse
          from email.message import EmailMessage
          from pathlib import Path
          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              for record in event.get("Records", []):
                  bucket = record["s3"]["bucket"]["name"]
                  raw_key = record["s3"]["object"]["key"]
                  key = urllib.parse.unquote_plus(raw_key)

                  logger.info("report-mailer triggered trigger=s3 key=%s", key)

                  s3 = boto3.client("s3")
                  response = s3.get_object(Bucket=bucket, Key=key)
                  csv_content = response["Body"].read()

                  sender = os.environ["SENDER_EMAIL"]
                  recipients = [r.strip() for r in os.environ["RECIPIENT_EMAILS"].split(",") if r.strip()]

                  filename = Path(key).name
                  msg = EmailMessage()
                  msg["Subject"] = f"Weekly Meetings Report: {filename}"
                  msg["From"] = sender
                  msg["To"] = ", ".join(recipients)
                  msg.set_content(f"Attached is the weekly meetings report ({filename}).\n")
                  msg.add_attachment(
                      csv_content,
                      maintype="text",
                      subtype="csv",
                      filename=filename,
                  )

                  ses = boto3.client("sesv2")
                  ses.send_email(
                      FromEmailAddress=sender,
                      Destination={"ToAddresses": recipients},
                      Content={"Raw": {"Data": msg.as_bytes()}},
                  )
              return {"status": "sent"}

  MailerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ReportMailerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}"
      SourceAccount: !Ref "AWS::AccountId"

  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: MailerInvokePermission
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteReportsAfter90Days
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt ReportMailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv

Outputs:
  ReportsBucketName:
    Value: !Ref ReportsBucket
  QueueUrl:
    Value: !Ref ReportQueue
  BuilderFunctionName:
    Value: !Ref ReportBuilderFunction
  MailerFunctionName:
    Value: !Ref ReportMailerFunction
